<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Status — PulseBoard</title>
    <meta name="description" content="Live uptime, latency, TLS and incident history — a serverless status page powered by GitHub Actions." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M4 34h12l6-16 10 30 8-22 5 8h15' fill='none' stroke='%2322c55e' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="alternate" type="application/rss+xml" title="Incidents" href="data/feed.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand"><svg viewBox="0 0 64 64" width="26" height="26"><path d="M4 34h12l6-16 10 30 8-22 5 8h15" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><h1 id="title">Status</h1></div>
        <p id="desc" class="muted"></p>
      </header>
      <section id="banner" class="banner">Loading…</section>
      <section id="incidentsNow"></section>
      <section id="groups"></section>
      <section>
        <h2>Past incidents</h2>
        <div id="history" class="incidents"></div>
      </section>
      <footer>
        <span id="updated" class="muted"></span>
        <span class="muted">· <a href="data/feed.xml">RSS</a> · <a href="data/status.json">JSON</a> · <a href="#" id="embedBtn">Badges</a> · Powered by <a href="https://github.com/mnbresearch/pulseboard">PulseBoard</a></span>
      </footer>
      <dialog id="embed"><form method="dialog"><h3>Embed badges</h3><div id="embedBody"></div><button class="btn">Close</button></form></dialog>
    </div>
    <script type="module" src="status.js"></script>
  </body>
</html>
